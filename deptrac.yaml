deptrac:
  paths:
    - ./src
  layers:
    - name: Casts
      collectors:
        - type: directory
          value: src/Casts/.*
    - name: Rules
      collectors:
        - type: directory
          value: src/Rules/.*
    - name: Http
      collectors:
        - type: directory
          value: src/Http/.*
    - name: Routing
      collectors:
        - type: directory
          value: src/Routing/.*
    - name: Internal
      collectors:
        - type: directory
          value: src/Internal/.*
    - name: Provider
      collectors:
        - type: classNameRegex
          value: /^MSSTC4PHP\\ValueObject\\Laravel\\ValueObjectServiceProvider$/
  ruleset:
    # The core and Illuminate are not layers, so every layer may use them.
    # Casts, Rules, Http and Routing never see each other: an app may use any of them alone.
    # Internal holds the shared helpers (labels, the message, composite JSON) and depends on nothing here.
    Casts:
      - Internal
    Rules:
      - Internal
    Http:
      - Internal
    Routing:
      - Internal
    Internal: ~
    Provider:
      - Http
      - Routing
